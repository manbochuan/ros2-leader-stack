      type: Script
      name: 脚本3
      x: 5034
      y: 188
      config:
        inputParams:
        - key: input1
          type: String
          value: "${Script_rtRL.envelope}"
          valueFrom: refer
        - key: input2
          type: Array<String>
          value: "${Iterator_171V.envelope}"
          valueFrom: refer
        outputParams:
        - key: envelope
          type: String
          desc: 输出结果
          properties: []
        nodeParam:
          scriptContent: "import json\n\n\ndef _pick(name, args, kwargs):\n    \"\"\
            \"取入参：平台标准 params 字典 > kwargs > 位置参数字典 > 模块全局变量\"\"\"\n    p = globals().get(\"\
            params\")\n    if isinstance(p, dict) and name in p:\n        return p[name]\n\
            \    if name in kwargs and kwargs[name] is not None:\n        return kwargs[name]\n\
            \    for a in args:\n        if isinstance(a, dict):\n            if name\
            \ in a and not isinstance(a[name], dict):\n                return a[name]\n\
            \            for holder in (\"params\", \"inputs\", \"variables\"):\n\
            \                inner = a.get(holder)\n                if isinstance(inner,\
            \ dict) and name in inner:\n                    return inner[name]\n \
            \   g = globals()\n    if name in g:\n        return g[name]\n    return\
            \ None\n\n\ndef _flatten(v):\n    \"\"\"归一成候选字符串列表（兼容 Array<String> /\
            \ None / 字面量 null）\"\"\"\n    out = []\n    if v is None:\n        return\
            \ out\n    if isinstance(v, str):\n        out.append(v)\n        return\
            \ out\n    if isinstance(v, (list, tuple)):\n        for item in v:\n\
            \            out.extend(_flatten(item))\n        return out\n    if isinstance(v,\
            \ dict):\n        out.append(json.dumps(v, ensure_ascii=False))\n    \
            \    return out\n    out.append(str(v))\n    return out\n\n\ndef _first_envelope(cands):\n\
            \    \"\"\"取第一个能解析成「含 valid 字段对象」的候选；数组则取其中第一个信封\"\"\"\n    for c in cands:\n\
            \        s = (c or \"\").strip()\n        if not s or s == \"null\":\n\
            \            continue\n        try:\n            obj = json.loads(s)\n\
            \        except Exception:\n            continue\n        if isinstance(obj,\
            \ dict) and \"valid\" in obj:\n            return json.dumps(obj, ensure_ascii=False)\n\
            \        if isinstance(obj, list):\n            for item in obj:\n   \
            \             if isinstance(item, dict) and \"valid\" in item:\n     \
            \               return json.dumps(item, ensure_ascii=False)\n    return\
            \ \"\"\n\n\ndef main(*args, **kwargs):\n    # 两个互斥分支在此归并：正常分支给 input1，\
            修复分支给 input2\n    # 未执行的分支平台渲染成字面量 \"null\"，由 _first_envelope 跳过\n   \
            \ cands = _flatten(_pick(\"input1\", args, kwargs)) + _flatten(_pick(\"\
            input2\", args, kwargs))\n    envelope = _first_envelope(cands)\n    return\
            \ {\"envelope\": envelope, \"ok\": bool(envelope)}"
          tryCatchConfig:
            strategy: noop
          retryConfig:
            retryEnabled: false
            maxRetries: 3
            retryInterval: 500
          scriptType: python
