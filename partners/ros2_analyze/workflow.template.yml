              id: LLM_lTj3
              name: 大模型2
              parentId: Iterator_171V
              width: 320
              type: LLM
              x: 382
              y: 72
            - config:
                inputParams:
                - key: llm_output
                  valueFrom: refer
                  value: "${LLM_lTj3.result}"
                  type: String
                outputParams:
                - key: passed
                  type: Boolean
                  desc: 通过结果
                  properties: []
                - key: envelope
                  type: String
                  desc: ""
                - key: raw
                  type: String
                  desc: ""
                - key: error_msg
                  type: String
                  desc: ""
                nodeParam:
                  scriptContent: "import json\nimport re\n\nTOPIC_RE = re.compile(r\"\
                    (?<![\\w/])/[A-Za-z_][A-Za-z0-9_]*\")\n\n# 外部话题白名单：传感器/执行器等不由本\
                    项目模块生产的话题\nEXTERNAL_TOPICS = {\n    \"/scan\", \"/cmd_vel\", \"\
                    /odom\", \"/map\", \"/tf\", \"/tf_static\", \"/clock\",\n    \"\
                    /image_raw\", \"/camera/image_raw\", \"/imu\", \"/joint_states\"\
                    \n}\n\n\ndef extract_json(text):\n    \"\"\"从可能带 markdown 围栏或解\
                    释文字的文本中提取首个 JSON 对象\"\"\"\n    if not text:\n        return None,\
                    \ \"模型输出为空\"\n    t = text.strip()\n    # 去除 ```json ... ``` 围\
                    栏\n    if t.startswith(\"```\"):\n        parts = t.split(\"```\"\
                    )\n        if len(parts) >= 3:\n            t = parts[1]\n   \
                    \     if t.lstrip()[:4].lower() == \"json\":\n            t =\
                    \ t.lstrip()[4:]\n    left, right = t.find(\"{\"), t.rfind(\"\
                    }\")\n    if left == -1 or right == -1 or right <= left:\n   \
                    \     return None, \"输出中未找到 JSON 对象\"\n    try:\n        return\
                    \ json.loads(t[left:right + 1]), \"\"\n    except Exception as\
                    \ e:\n        return None, \"JSON 解析失败: %s\" % str(e)\n\n\ndef\
                    \ validate(data):\n    \"\"\"结构校验 + 话题闭环检查，返回错误信息列表\"\"\"\n  \
                    \  errors = []\n    if not isinstance(data, dict):\n        return\
                    \ [\"根节点必须是 JSON 对象\"]\n\n    # need_ask 必须是布尔值\n    if not isinstance(data.get(\"\
                    need_ask\"), bool):\n        errors.append(\"need_ask 必须为布尔值 true/false\"\
                    )\n\n    # 追问场景：只校验 ask_question\n    if data.get(\"need_ask\"\
                    ) is True:\n        if not str(data.get(\"ask_question\", \"\"\
                    )).strip():\n            errors.append(\"need_ask=true 时 ask_question\
                    \ 必填\")\n        return errors\n\n    # 正常场景：project 校验\n    project\
                    \ = data.get(\"project\")\n    if not isinstance(project, dict):\n\
                    \        errors.append(\"project 缺失或不是对象\")\n    else:\n     \
                    \   for field in (\"name_en\", \"name_cn\", \"package_name\",\
                    \ \"difficulty\", \"description\"):\n            if not str(project.get(field,\
                    \ \"\")).strip():\n                errors.append(\"project.%s\
                    \ 缺失\" % field)\n\n    # modules 校验\n    modules = data.get(\"\
                    modules\")\n    if not isinstance(modules, list) or len(modules)\
                    \ == 0:\n        errors.append(\"modules 必须为非空数组\")\n        return\
                    \ errors\n\n    produced = set()\n    for i, module in enumerate(modules):\n\
                    \        prefix = \"modules[%d]\" % i\n        if not isinstance(module,\
                    \ dict):\n            errors.append(prefix + \" 必须是对象\")\n   \
                    \         continue\n        if not str(module.get(\"module_name\"\
                    , \"\")).strip():\n            errors.append(prefix + \".module_name\
                    \ 缺失\")\n        if not str(module.get(\"function\", \"\")).strip():\n\
                    \            errors.append(prefix + \".function 缺失\")\n      \
                    \  if not isinstance(module.get(\"inputs\"), list):\n        \
                    \    errors.append(prefix + \".inputs 必须是数组\")\n        if not\
                    \ isinstance(module.get(\"outputs\"), list):\n            errors.append(prefix\
                    \ + \".outputs 必须是数组\")\n        for out in module.get(\"outputs\"\
                    , []):\n            if isinstance(out, dict) and out.get(\"topic\"\
                    ):\n                produced.add(out[\"topic\"])\n\n    # 话题闭环\
                    ：内部输入话题必须有生产模块\n    for i, module in enumerate(modules):\n   \
                    \     if not isinstance(module, dict):\n            continue\n\
                    \        prefix = \"modules[%d]\" % i\n        name = str(module.get(\"\
                    module_name\", \"\")).strip() or prefix\n        inputs = module.get(\"\
                    inputs\", []) or []\n        outputs = module.get(\"outputs\"\
                    , []) or []\n\n        for inp in inputs:\n            if not\
                    \ isinstance(inp, dict):\n                continue\n         \
                    \   topic = inp.get(\"topic\", \"\")\n            if topic and\
                    \ topic not in produced and topic not in EXTERNAL_TOPICS:\n  \
                    \              errors.append(\"话题 %s 没有生产模块（且不在外部话题白名单）\" % topic)\n\
                    \n        # 交叉校验：禁止通过删除字段来通过校验\n        declared = set()\n   \
                    \     for item in list(inputs) + list(outputs):\n            if\
                    \ isinstance(item, dict) and item.get(\"topic\"):\n          \
                    \      declared.add(item[\"topic\"])\n        desc = \"%s %s\"\
                    \ % (module.get(\"function\", \"\"), module.get(\"description\"\
                    , \"\"))\n        for topic in sorted(set(TOPIC_RE.findall(desc))):\n\
                    \            if topic not in declared:\n                errors.append(\n\
                    \                    \"模块 %s 的 function 提到话题 %s，但 inputs/outputs\
                    \ 里没有声明（禁止用删除字段的方式通过校验；请补齐该话题的声明，并为模块间话题补齐生产者模块）\"\n         \
                    \           % (name, topic)\n                )\n        if \"订\
                    阅\" in str(module.get(\"function\", \"\")) and not inputs:\n \
                    \           errors.append(\n                \"模块 %s 的 function\
                    \ 写明「订阅」但 inputs 为空（禁止删除订阅声明来通过校验；请把被订阅话题补回 inputs，并为模块间话题补一个生\
                    产者模块）\"\n                % name\n            )\n\n    return errors\n\
                    \n\ndef _pick(name, args, kwargs):\n    \"\"\"从多来源取入参：kwargs >\
                    \ 位置参数字典 > 模块全局变量（百炼把入参注入为模块级变量）\"\"\"\n    if name in kwargs\
                    \ and kwargs[name] is not None:\n        return kwargs[name]\n\
                    \    for a in args:\n        if isinstance(a, dict):\n       \
                    \     if name in a and not isinstance(a[name], dict):\n      \
                    \          return a[name]\n            for holder in (\"params\"\
                    , \"inputs\", \"variables\"):\n                inner = a.get(holder)\n\
                    \                if isinstance(inner, dict) and name in inner:\n\
                    \                    return inner[name]\n    g = globals()\n \
                    \   if name in g:\n        return g[name]\n    if isinstance(g.get(\"\
                    params\"), dict) and name in g[\"params\"]:\n        return g[\"\
                    params\"][name]\n    return None\n\n\ndef main(*args, **kwargs):\n\
                    \    # 百炼脚本节点入口：平台以「无参」调用 main()，入参以模块全局变量注入\n    raw = _pick(\"\
                    llm_output\", args, kwargs) or \"\"\n    raw = raw if isinstance(raw,\
                    \ str) else str(raw)\n    raw = raw.strip()\n\n    data, parse_err\
                    \ = extract_json(raw)\n    error_msg = parse_err\n    if data\
                    \ is not None:\n        error_list = validate(data)\n        error_msg\
                    \ = \"；\".join(error_list)\n\n    # 注意：passed 是 Python 布尔值 True/False，\
                    下游按布尔比较\n    passed = data is not None and error_msg == \"\"\n\
                    \n    if passed:\n        envelope = json.dumps({\n          \
                    \  \"valid\": True,\n            \"need_ask\": data.get(\"need_ask\"\
                    , False),\n            \"ask_question\": data.get(\"ask_question\"\
                    , \"\"),\n            \"data\": data\n        }, ensure_ascii=False)\n\
                    \    else:\n        # 修复 1 次后仍失败：降级信封，Leader 据此改走原文透传/提示重试\n \
                    \       envelope = json.dumps({\n            \"valid\": False,\n\
                    \            \"need_ask\": False,\n            \"ask_question\"\
                    : \"\",\n            \"data\": None,\n            \"raw\": raw,\n\
                    \            \"error_msg\": error_msg\n        }, ensure_ascii=False)\n\
                    \n    return {\n        \"passed\": passed,\n        \"envelope\"\
                    : envelope,\n        \"raw\": raw,\n        \"error_msg\": error_msg\n\
                    \    }"
                  scriptType: python
                  retryConfig:
                    retryEnabled: false
                    maxRetries: 3
                    retryInterval: 500
                  tryCatchConfig:
                    strategy: noop
