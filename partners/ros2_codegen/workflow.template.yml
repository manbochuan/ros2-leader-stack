                outputParams: []
                nodeParam: {}
              id: IteratorStart_g0xI
              name: 循环开始
              parentId: Iterator_3aWV
              width: 320
              type: IteratorStart
              x: 32
              y: 72
            - config:
                inputParams: []
                outputParams: []
                nodeParam: {}
              id: IteratorEnd_u0Pr
              name: 迭代结束
              parentId: Iterator_3aWV
              width: 320
              type: IteratorEnd
              x: 2382
              y: 72
            - config:
                inputParams: []
                outputParams:
                - key: result
                  type: String
                  desc: 文本输出
                  isSystem: true
                nodeParam:
                  promptContent: "${Script_B9sf.result}${LLM_Mdnl.result}"
                  sysPromptContent: "你是一个 ROS2 学习助手。以下代码有问题，请根据错误列表修复。\n\n修复原则：\n\
                    - 只修错误，不要借机加额外功能\n- 保持代码简洁，不要过度设计\n- 改完后代码要能跑通\n- 类名、节点名、话题名必须\
                    跟结构化需求里的一致，不能乱改\n\n\n【原始代码】\n\n${LLM_Mdnl.result}\n\n\n【需要修复的错\
