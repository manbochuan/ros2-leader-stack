                  output: "${LLM_wQ4V.result}${Script_Y7kF.result}${Script_Y7kF.passed}"
                  streamSwitch: true
              id: Output_PHqc
              name: 流程输出3
              parentId: Iterator_3aWV
              width: 320
              type: Output
              x: 1912
              y: 72
            - config:
                inputParams:
                - key: code
                  valueFrom: refer
                  value: "${LLM_wQ4V.result}"
                  type: String
                - key: spec
                  valueFrom: refer
                  value: "${LLM_3GUn.result}"
