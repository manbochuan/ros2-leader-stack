    - id: LLM_Mdnl
      type: LLM
      name: 大模型2
      x: 1422
      y: 269
      config:
        inputParams: []
        outputParams:
        - key: result
          type: String
          desc: 文本输出
        nodeParam:
          shortMemory:
            enabled: false
            type: self
            round: 3
            param:
              key: historyList
              type: Array<String>
              valueFrom: refer
              value: "${sys.historyList}"
          tryCatchConfig:
            strategy: noop
            defaultValues:
            - key: result
              type: String
              desc: 文本输出
              isSystem: true
          batchEnable: false
          modelConfig:
            modelId: qwen3-coder-flash
            params:
              top_p: 0.8
              temperature: 0.5
              result_format: message
            referParams: []
            modelName: Qwen3-Coder-Flash
            capabilities:
            - TG
          retryConfig:
            retryEnabled: false
            maxRetries: 3
            retryInterval: 500
          concurrentSize: 5
          processCanOutput: false
          contextParam:
            key: historyList
            type: Array<String>
            valueFrom: refer
            value: "${sys.historyList}"
          sysPromptContent: |
            你是一个 ROS2 学习助手，专门帮学生写最简洁的 ROS2 Python 代码。

            【核心原则：最少代码，只做要求的事】
            1. 代码越简单越好，能省就省，只实现用户要求的功能
            2. 绝对不要加用户没提到的功能（比如参数服务器、异常处理、额外日志等）
            3. 变量名和注释要清晰，方便学生理解
            4. 保持 ROS2 的基本规范，但不要过度设计


            【必须有的基本结构】
            - 节点类继承 rclpy.node.Node
            - __init__ 里调用 super().__init__("")
            - 发布者/订阅者在 __init__ 里创建
            - 有 main 函数，包含 rclpy.init(args=args)、创建节点、rclpy.spin(节点)、rclpy.shutdown()
            - 用 self.get_logger().info() 输出关键信息（必要时才加，不要到处打日志）

            【不要加的东西（除非用户明确要求）】
            - ❌ 不要加 Apache 协议头
            - ❌ 不要加参数声明（declare_parameter / get_parameter）
            - ❌ 不要加异常处理 try-except
            - ❌ 不要加无关的 import
            - ❌ 不要加生命周期相关的东西
            - ❌ 不要加 QoS 设置（用默认的就行）
            - ❌ 不要加定时器（除非用户要定时功能）
            - ❌ 不要加多余的日志
            - 必须写 `from rclpy.node import Node`，然后 `class XxxNode(Node):`
            - ❌ 禁止写 `rclpy.Node` —— rclpy 模块没有 Node 属性，运行会 AttributeError

            【代码风格】
            - 注释：只在关键地方加中文注释，解释为什么这么做
            - 空行：逻辑块之间加空行，不要太密也不要太散


            【知识库参考资料使用规则】
            - 用户提示词里的「知识库参考资料」是从 ROS2 官方知识库检索到的原文，优先依据它写代码。
            - 资料中出现的 API 用法、消息类型定义、代码规范，以资料为准，不要凭记忆改写。
            - 如果资料与本次需求无关，或「知识库参考资料」为空，就忽略它，按你自己的知识正常作答。
            - 不要大段照抄资料，只把它当作事实依据。
          promptContent: "【知识库参考资料】\n${Plugin_lhKK.context}\n\n【结构化需求】\n${LLM_3GUn.result}"
          cacheStrategy: disabled
          batchSize: 50
          contextSwitch: false
    - id: Output_KlOn
      type: Output
