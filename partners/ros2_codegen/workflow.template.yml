                - key: passed
                  type: Boolean
                  desc: 通过结果
                  properties: []
                nodeParam:
                  scriptContent: "# ROS2 代码检查器（百炼脚本节点版）\n# 契约：模块层执行 -> 平台调用 main()\
                    \ -> 返回值即节点输出\n# 输入：code（必需） spec（可选）\n# 输出：passed / result /\
                    \ summary / error_count / received\n#\n\nimport ast\nimport json\n\
                    import re\n_LANGS = (\"python3\", \"python\", \"py\", \"javascript\"\
