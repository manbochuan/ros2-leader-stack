            , \"content\", \"text\", \"output\", \"data\", \"answer\",\n         \
            \   \"response\", \"value\", \"code\", \"generated_code\", \"fixed_code\"\
            ,\n            \"code_text\")\ndef _strip(t):\n    \"\"\"剥离 markdown 围\
            栏。兼容 '```pythonimport x'（围栏与代码粘在一起）。\n    做法：剥掉围栏后生成两个候选（去掉语言标记 / 不去掉）\
            ，\n    取第一个能通过 ast.parse 的。这样既不会把 'pythonimport' 吃掉，\n    也不会误伤真的以 'python'\
            \ 开头的代码。\n    \"\"\"\n    if not isinstance(t, str):\n        return \"\
            \"\n    s = t.strip()\n    if not s.startswith(\"```\"):\n        return\
            \ s\n    b = s[3:]\n    e = b.rfind(\"```\")\n    if e != -1:\n      \
            \  b = b[:e]\n    m = _LANG.match(b)\n    c1 = (b[m.end():] if m else\
            \ b).strip(\"\\n\")\n    c2 = b.strip(\"\\n\")\n    for c in (c1, c2):\n\
            \        if c.strip():\n            try:\n                ast.parse(c)\n\
            \                return c\n            except Exception:\n           \
            \     pass\n    return c1 if c1.strip() else c2\ndef _cs(n):\n    return\
            \ n.value if isinstance(n, ast.Constant) and isinstance(n.value, str)\
            \ else None\ndef _es(n):\n    if isinstance(n, ast.Name):\n        return\
            \ n.id\n    if isinstance(n, ast.Attribute):\n        b = _es(n.value)\n\
            \        return (b + \".\" + n.attr) if b else n.attr\n    return \"\"\
            \ndef _mc(t, m):\n    for n in ast.walk(t):\n        if isinstance(n,\
            \ ast.Call) and isinstance(n.func, ast.Attribute) \\\n               \
            \ and n.func.attr == m:\n            yield n\ndef _co(t, base, attr):\n\
            \    for n in ast.walk(t):\n        if isinstance(n, ast.Call) and isinstance(n.func,\
            \ ast.Attribute) \\\n                and n.func.attr == attr:\n      \
            \      if _es(n.func.value).split(\".\")[-1] == base:\n              \
            \  yield n\ndef _lj(v):\n    if isinstance(v, (dict, list)):\n       \
            \ return v\n    if not isinstance(v, str):\n        return None\n    t\
            \ = _strip(v).strip()\n    if not t:\n        return None\n    try:\n\
            \        return json.loads(t)\n    except Exception:\n        pass\n \
            \   i, j = t.find(\"{\"), t.rfind(\"}\")\n    if i != -1 and j > i:\n\
            \        try:\n            return json.loads(t[i:j + 1])\n        except\
            \ Exception:\n            return None\n    return None\ndef _nt(n):\n\
            \    if n is None:\n        return \"\"\n    s = str(n).strip().strip(\"\
            \\\"'\")\n    return (\"/\" + s.lstrip(\"/\")) if s else \"\"\ndef _nty(t):\n\
            \    if not t:\n        return \"\"\n    s = str(t).strip().strip(\"\\\
            \"'\").replace(\".msg.\", \"/\").replace(\".\", \"/\")\n    p = [x for\
            \ x in s.split(\"/\") if x and x != \"msg\"]\n    return \"/\".join(p[-2:])\
            \ if len(p) >= 2 else (p[0] if p else \"\")\ndef _tm(a, b):\n    if not\
            \ a or not b:\n        return True\n    if \"/\" in a and \"/\" in b:\n\
            \        return a == b\n    return a.split(\"/\")[-1] == b.split(\"/\"\
            )[-1]\ndef _ct(raw):\n    out = []\n    if not raw:\n        return out\n\
            \    if isinstance(raw, dict):\n        raw = [raw]\n    if isinstance(raw,\
            \ str):\n        p = _lj(raw)\n        raw = p if isinstance(p, (list,\
            \ dict)) else \\\n            [x.strip() for x in re.split(r\"[,，;；\\\
            n]\", raw) if x.strip()]\n    if not isinstance(raw, list):\n        return\
            \ out\n    for it in raw:\n        if isinstance(it, str):\n         \
            \   out.append({\"name\": _nt(it), \"type\": \"\"})\n        elif isinstance(it,\
            \ dict):\n            out.append({\"name\": _nt(it.get(\"name\") or it.get(\"\
            topic\") or \"\"),\n                        \"type\": _nty(it.get(\"type\"\
            ) or it.get(\"msg_type\") or \"\")})\n    return [x for x in out if x[\"\
            name\"]]\ndef _spec(s):\n    d = _lj(s)\n    if not isinstance(d, dict):\n\
            \        d = {}\n    return {\"n\": str(d.get(\"node_name\") or \"\").strip(),\n\
            \            \"c\": str(d.get(\"class_name\") or \"\").strip(),\n    \
            \        \"p\": _ct(d.get(\"publish_topics\")),\n            \"s\": _ct(d.get(\"\
            subscribe_topics\"))}\ndef _usable(sp):\n    return bool(sp[\"n\"] or\
            \ sp[\"c\"] or sp[\"p\"] or sp[\"s\"])\ndef check(code, spec=None):\n\
            \    E, W = [], []\n    def err(i, m, l=0):\n        E.append({\"id\"\
            : i, \"msg\": m, \"line\": l})\n    def warn(i, m, l=0):\n        W.append({\"\
            id\": i, \"msg\": m, \"line\": l})\n    sp = _spec(spec)\n    src = _strip(code)\n\
            \    if not _usable(sp):\n        warn(\"W201\", \"未接 spec 或解析为空，已跳过类名\
            /节点名/话题一致性校验\", 0)\n    if not src.strip():\n        err(\"E000\", \"代\
            码为空：没收到 code，或收到的内容剥离后为空\", 0)\n        return E, W, sp\n    try:\n  \
            \      tree = ast.parse(src)\n    except SyntaxError as ex:\n        err(\"\
            E001\", \"语法错误：第 %s 行 —— %s\" % (ex.lineno, ex.msg), ex.lineno or 0)\n\
            \        return E, W, sp\n    names, tmap = set(), {}\n    for n in ast.walk(tree):\n\
            \        if isinstance(n, ast.Import):\n            for a in n.names:\n\
            \                names.add(a.asname or a.name.split(\".\")[0])\n     \
            \   elif isinstance(n, ast.ImportFrom):\n            mod = n.module or\
            \ \"\"\n            for a in n.names:\n                names.add(a.asname\
            \ or a.name)\n                if mod:\n                    tmap[a.asname\
            \ or a.name] = _nty(mod + \".\" + a.name)\n    if \"rclpy\" not in names:\n\
            \        err(\"E107\", \"缺少 `import rclpy`（后面 rclpy.init/spin 会 NameError）\
            \", 0)\n    cls, dotted_ok = [], False\n    for c in ast.walk(tree):\n\
            \        if not isinstance(c, ast.ClassDef):\n            continue\n \
            \       for b in c.bases:\n            t = _es(b)\n            if t ==\
            \ \"Node\" or t.endswith(\".Node\"):\n                cls.append(c)\n\
            \                if t.endswith(\".Node\"):\n                    mod =\
            \ t[:-5]\n                    if mod == \"rclpy.node\":\n            \
            \            dotted_ok = True\n                    else:\n           \
            \             err(\"E116\", \"基类 `%s` 不存在：Node 在 rclpy.node 里，\"\n   \
            \                         \"`rclpy` 本身没有 Node 属性（运行时会 AttributeError）。\
            \"\n                            \"正确写法是 `from rclpy.node import Node`\
            \ 然后用 `Node`\"\n                            % t, c.lineno)\n         \
            \       break\n    if \"Node\" not in names and not dotted_ok:\n     \
            \   err(\"E107\", \"缺少 `from rclpy.node import Node`\", 0)\n    if not\
            \ cls:\n        err(\"E101\", \"没有找到继承自 Node 的节点类\", 0)\n        mc =\
            \ None\n    else:\n        mc = cls[0]\n    if mc is not None:\n     \
            \   if sp[\"c\"] and mc.name != sp[\"c\"]:\n            err(\"E108\",\
            \ \"类名不一致：需求 `%s` / 代码 `%s`\" % (sp[\"c\"], mc.name), mc.lineno)\n   \
            \     im = None\n        for it in mc.body:\n            if isinstance(it,\
            \ ast.FunctionDef) and it.name == \"__init__\":\n                im =\
            \ it\n                break\n        if im is None:\n            err(\"\
            E105\", \"节点类缺少 `__init__` 方法\", mc.lineno)\n        else:\n         \
            \   si = None\n            for call in ast.walk(im):\n               \
            \ if isinstance(call, ast.Call) and isinstance(call.func, ast.Attribute)\
            \ \\\n                        and call.func.attr == \"__init__\":\n  \
            \                  inner = call.func.value\n                    if isinstance(inner,\
            \ ast.Call) and isinstance(inner.func, ast.Name) \\\n                \
            \            and inner.func.id == \"super\":\n                       \
            \ si = call\n                        break\n            if si is None:\n\
            \                err(\"E102\", \"`__init__` 中没有调用 `super().__init__(...)`\"\
            , im.lineno)\n            elif si.args:\n                nn = _cs(si.args[0])\
            \ or \"\"\n                if sp[\"n\"] and nn and nn != sp[\"n\"]:\n\
            \                    err(\"E109\", \"节点名不一致：需求 `%s` / 代码 `%s`\" % (sp[\"\
            n\"], nn), si.lineno)\n    if not [n for n in ast.walk(tree)\n       \
            \     if isinstance(n, ast.FunctionDef) and n.name == \"main\"]:\n   \
            \     err(\"E103\", \"缺少 `main` 函数\", 0)\n    if not any(True for _ in\
            \ _co(tree, \"rclpy\", \"init\")):\n        err(\"E104\", \"缺少 `rclpy.init()`\"\
            , 0)\n    if not (any(True for _ in _co(tree, \"rclpy\", \"spin\")) or\n\
            \            any(True for _ in _co(tree, \"rclpy\", \"spin_once\"))):\n\
            \        err(\"E104\", \"缺少 `rclpy.spin()`，节点不会进入事件循环\", 0)\n    if not\
            \ (any(True for _ in _co(tree, \"rclpy\", \"shutdown\")) or\n        \
            \    any(True for _ in _mc(tree, \"destroy_node\"))):\n        err(\"\
            E104\", \"缺少 `rclpy.shutdown()` 或 `node.destroy_node()`\", 0)\n    pubs,\
            \ subs = {}, {}\n    for c in _mc(tree, \"create_publisher\"):\n     \
            \   if len(c.args) != 3:\n            err(\"E112\", \"`create_publisher`\
            \ 参数 %d 个，应为 3 个\" % len(c.args), c.lineno)\n        if len(c.args) >\
            \ 1 and _cs(c.args[1]):\n            raw = _es(c.args[0])\n          \
            \  r = tmap.get(raw) or (_nty(raw) if \".\" in raw else \"\")\n      \
            \      pubs[_nt(_cs(c.args[1]))] = {\"line\": c.lineno, \"type\": r,\n\
            \                                         \"res\": bool(r), \"raw\": raw}\n\
            \    for c in _mc(tree, \"create_subscription\"):\n        if len(c.args)\
