        nodeParam:
          scriptContent: "# ROS2 代码检查器（百炼脚本节点版）\n# 契约：模块层执行 -> 平台调用 main() -> 返回值即\
            节点输出\n# 输入：code（必需） spec（可选）\n# 输出：passed / result / summary / error_count\
            \ / received\n#\n\nimport ast\nimport json\nimport re\n_LANGS = (\"python3\"\
            , \"python\", \"py\", \"javascript\", \"js\", \"typescript\", \"ts\",\n\
            \          \"bash\", \"shell\", \"sh\", \"json\", \"yaml\", \"yml\", \"\
            xml\", \"html\",\n          \"css\", \"cpp\", \"c\\\\+\\\\+\", \"c\",\
            \ \"java\", \"go\", \"rust\", \"sql\",\n          \"text\", \"plaintext\"\
            )\n_LANG = re.compile(r\"[ \\t]*(\" + \"|\".join(_LANGS) + r\")[ \\t]*\\\
